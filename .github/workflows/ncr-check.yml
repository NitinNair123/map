name: NCR map check
on:
  push:
    branches: [claude/project-thread-9zvevn]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install osmium
      - run: python -m unittest test_safety
      - name: Map styles the app loads (OpenFreeMap)
        run: for s in liberty; do curl -s -o /dev/null -w "$s %{http_code}\n" https://tiles.openfreemap.org/styles/$s; done
  ncr:
    # the full import downloads about 575 MB and takes 10-15 minutes, so it runs only when asked
    if: contains(github.event.head_commit.message, '[ncr-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install osmium
      - run: python -u import_osm.py
      - run: python -u check_ncr.py
  crime:
    # NCRB district crime-against-women figures and OSM district outlines, as the server uses them
    if: contains(github.event.head_commit.message, '[crime-fetch]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u crime.py
      - run: python -c "import crime; d=crime.load(); print([a['district'] for a in crime.around(d, [(28.4741, 77.4998), (28.6315, 77.2167), (28.4595, 77.0266)])])"
