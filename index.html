<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafeRoute</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#fff; --fg:#1d1b22; --muted:#6b6672; --card:#f5f3f8; --accent:#7b2cbf; --good:#1a9850; --mid:#f39c12; --bad:#d73027; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16141a; --fg:#eeeaf2; --muted:#a39dab; --card:#24212a; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; height:100dvh; }
  #map { flex:1; min-height:40vh; }
  #panel { padding:12px 16px 88px; max-height:55vh; overflow:auto; }
  form { display:grid; gap:8px; }
  input, button { font:inherit; padding:10px; border-radius:10px; border:1px solid #8884; background:var(--card); color:var(--fg); width:100%; }
  button.primary { background:var(--accent); color:#fff; border:0; font-weight:600; }
  label.row { display:flex; gap:8px; align-items:center; color:var(--muted); font-size:14px; }
  label.row input { width:auto; }
  .card { background:var(--card); border-radius:12px; padding:10px 12px; margin-top:10px; cursor:pointer; border:2px solid transparent; }
  .card.sel { border-color:var(--accent); }
  .card h3 { margin:0 0 4px; font-size:16px; display:flex; justify-content:space-between; }
  .score { font-weight:700; }
  .chips span { display:inline-block; font-size:12px; padding:2px 8px; border-radius:99px; margin:2px 4px 0 0; background:#1a985022; }
  .chips span.w { background:#d7302722; }
  .muted { color:var(--muted); font-size:13px; }
  #status { margin-top:8px; }
  #sos { position:fixed; right:16px; bottom:16px; z-index:1000; width:64px; height:64px; border-radius:50%; background:var(--bad); color:#fff; font-weight:800; border:0; box-shadow:0 4px 14px #0006; }
  .actions { display:flex; gap:8px; margin-top:10px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <form id="f">
    <input id="from" placeholder="From (blank = my location)" autocomplete="off">
    <input id="to" placeholder="To" required autocomplete="off">
    <input id="when" type="datetime-local" aria-label="Departure time">
    <label class="row"><input id="avoidInformal" type="checkbox" checked> Avoid informal settlements</label>
    <button class="primary">Find safest route</button>
  </form>
  <div id="status" class="muted"></div>
  <div id="results"></div>
  <div class="actions" id="tripActions" hidden>
    <button id="share">Share my trip</button>
    <a id="call" href="tel:112"><button type="button">Call 112</button></a>
  </div>
  <p class="muted">Scores come from OpenStreetMap data and can be wrong or incomplete. Treat “safest” as “safer”; trust your instincts.</p>
</div>
<button id="sos" aria-label="SOS: share location and call 112">SOS</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
